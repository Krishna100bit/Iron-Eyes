# ===========================================================================
# IronLoop Phase-1 Firmware — prj.conf  (USB-powered, no battery, no button)
# ===========================================================================

# ---------------------------------------------------------------------------
# Bluetooth (BLE peripheral stack)
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IronLoop"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Single central connection
CONFIG_BT_MAX_CONN=1

# MTU & Buffer sizes (78-byte batched payload)
CONFIG_BT_L2CAP_TX_MTU=128
CONFIG_BT_BUF_ACL_TX_SIZE=128
CONFIG_BT_BUF_ACL_RX_SIZE=128
CONFIG_BT_CTLR_DATA_LENGTH_MAX=128

# ---------------------------------------------------------------------------
# I2C (LSM6DS3TR-C on I2C0 / TWI0)
# ---------------------------------------------------------------------------
CONFIG_I2C=y

# ---------------------------------------------------------------------------
# GPIO (for IMU power rail P1.08)
# ---------------------------------------------------------------------------
CONFIG_GPIO=y

# ---------------------------------------------------------------------------
# Logging (UART / USB serial console)
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---------------------------------------------------------------------------
# Power Management (System OFF Sleep / Wake)
# ---------------------------------------------------------------------------
CONFIG_PM=y
CONFIG_POWEROFF=y

# ---------------------------------------------------------------------------
# ADC (Battery SAADC monitor)
# ---------------------------------------------------------------------------
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# ---------------------------------------------------------------------------
# Kernel features
# ---------------------------------------------------------------------------
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ASSERT=y
CONFIG_FPU=y

